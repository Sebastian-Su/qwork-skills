schema_version: 1
product: qwork-workbuddy-oracle
rules:
  primary: accessible-role-and-name
  coordinates: oracle-only
  force_click: forbidden
workbuddy_5_3_12:
  main_renderer: "CDP page whose URL starts with file:///Applications/WorkBuddy.app/"
  sidebar:
    tablist: {role: tablist, name: Agents tabs}
    expand: "first visible 32x32 button with y < 50 when the tablist is absent"
    top_tabs: [新建任务, 助理, 项目, 专家·技能·连接器, 自动化, 资料库, 更多 应用·灵感]
  market_entry:
    experts: "button.wb-dropdown__item-hit[data-track-props*=experts]"
    skills: "button.wb-dropdown__item-hit[data-track-props*=skills]"
    connectors: "button.wb-dropdown__item-hit[data-track-props*=connectors]"
  market_page_tabs:
    experts: {role: tab, name: 专家}
    skills: {role: tab, name: 技能}
    connectors: {role: tab, name: 连接器}
  connector_detail:
    overlay: ".connector-detail-modal-overlay"
    close: "button.connector-detail-close"
    close_oracle: "overlay is no longer visible"
    forbidden_primary_action: ".connector-detail-btn--try"
  expert_type_tabs: [{text: 专家, exact: true}, {text: 专家团, exact: true}]
  automation_tabs: [{text: 定时任务, exact: true}, {text: 运行记录, exact: true}]
  mutation_denylist: [新建, 添加, 安装, 连接, 授权, 删除, 移除, 发送, 运行, 执行, 创建, 提交, 保存, 确认, 召唤, 重试, 完全访问, 退出登录]
qwork:
  source: repo://e2e/fixtures/launch.ts
  semantic_locator_policy: role-name-test-id
